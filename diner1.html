<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ohmyfood - Réservez votre menu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Shrikhand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="css/diner.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <a href="index.html" class="header__return">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <div class="header__logo">
                <a href="index.html" aria-label="Ohmyfood - Accueil">
                    <img src="images/logo/ohmyfood@2x.svg" alt="Ohmyfood">
                </a>
            </div>
    </header>

    <main>
        <!-- BACKGROUND -->
        <section class="background">
            <img
                src="images/restaurants/jay-wennington-N_Y88TWmGwA-unsplash.jpg"
                alt="Plat gastronomique"
                class="background__image"
            >
        </section>

        <!-- MENU -->
        <section class="menus" id="menus">
            <div class="container">

                <h2 class="menus__title">
                    La palette du goût
                    <i class="fa fa-heart-o"></i>
                </h2>

                <div class="menu__list">
                    <div class="menu_card">

                        <h3 class="menu-card__title">ENTRÉES</h3>

                        <article class="menu-card__content">
                            <h3 class="menu-card__name">Fricassée d'escargots</h3>
                            <p class="menu-card__description">Au piment d'Espelette</p>
                            <p class="menu-card__price">25€</p>
                        </article>
                    </div>
                    <article class="menu-card">

                        <h3 class="menu-card__title">PLATS</h3>

                        <div class="menu-card__content">
                            <h3 class="menu-card__name">Filet de bœuf aux herbes</h3>
                            <p class="menu-card__description">Accompagné de sa ribambelle de légumes</p>
                            <p class="menu-card__price">40€</p>
                        </div>
                    </article>
                    <article class="menu-card">

                        <h3 class="menu-card__title">DESSERTS</h3>

                        <div class="menu-card__content">
                            <h3 class="menu-card__name">Paris-Brest</h3>
                            <p class="menu-card__description">Revisité</p>
                            <p class="menu-card__price">18€</p>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container footer__content">

            <a href="index.html" class="footer__logo">
                <img src="images/logo/ohmyfood@2x.svg" alt="Ohmyfood">
            </a>

            <nav class="footer__navigation" aria-label="Navigation secondaire">
                <ul>
                    <li>
                        <a href="#">
                            <i class="fa-solid fa-utensils"></i>
                            Proposer un restaurant
                        </a>
                    </li>

                    <li>
                        <a href="#">
                            <i class="fa-solid fa-handshake-angle"></i>
                            Devenir partenaire
                        </a>
                    </li>

                    <li>
                        <a href="#">Mentions légales</a>
                    </li>

                    <li>
                        <a href="#">Contact</a>
                    </li>
                </ul>
            </nav>
        </div>
    </footer>
</body>
</html>
